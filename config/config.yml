shellPath: C:\Program Files\Git\bin\bash.exe
setupVersion: 2
modelRoles:
  default: anthropic/claude-opus-5:high
  speech: local/kokoro
  dictation: codex-voice/transcribe
dev:
  autoqaConsent: denied
hideThinkingBlock: true
display:
  hideToolActivity: true
  collapseCompacted: false
statusLine:
  preset: custom
  leftSegments:
    - vim
    - model
    - mode
    - path
    - git
    - pr
  rightSegments:
    - session_name
    - usage
    - token_total
    - context_pct
stt:
  enabled: true
  language: uk
  # Phrase-by-phrase cloud dictation; needs omp with can1357/oh-my-pi#20359, older omp ignores the key.
  cloudLive: true
compaction:
  methodOrder:
    - snapcompact
    - handoff
    - shake
    - soft
  keepRecentTokens: 40000
retry:
  fallbackChains:
    dictation:
      - local/whisper-large-v3-turbo